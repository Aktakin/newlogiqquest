<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070d14" />
    <meta
      name="description"
      content="LOGIQ — learn the logic behind programming by solving visual puzzles. Sequencing, loops and functions, taught the way engineers actually think."
    />
    <title>LOGIQ — Learn the logic behind the code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Must stay in step with src/lib/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('logiq.theme');
          var light =
            saved === 'light' ||
            (!saved && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
